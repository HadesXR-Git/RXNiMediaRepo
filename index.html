<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">

    <meta
      name="viewport"
      content="initial-scale=1, minimum-scale=1, width=device-width"
    >

    <title>Error 404 (Not Found)!!! - Under Construction</title>

    <style>
      * {
        margin: 0;
        padding: 0;
      }

      html,
      code {
        font: 15px/22px arial, sans-serif;
      }

      html {
        background: #fff;
        color: #222;
        padding: 15px;
      }

      /*
       * ==================================================
       * DESKTOP
       * ==================================================
       *
       * 769px and above.
       */
      body {
        margin: 7% auto 0;
        max-width: 390px;
        min-height: 180px;

        padding: 30px 0 15px;

        background:
          url("https://www.google.com/images/errors/robot.png")
          100% 5px
          no-repeat;

        padding-right: 205px;
      }

      /*
       * ==================================================
       * 404 TEXT
       * ==================================================
       *
       * Desktop:
       * - 30px to the right
       * - 20px upward
       */
      p {
        margin: -20px 0 22px 30px;
        overflow: hidden;
      }

      ins {
        color: #777;
        text-decoration: none;
      }

      a img {
        border: 0;
      }

      /*
       * ==================================================
       * LOGO LINK
       * ==================================================
       *
       * The logo links to the GitHub repository.
       * The logo and link cannot be dragged.
       */
      .logo-container,
      .logo-container a {
        user-select: none;
        -webkit-user-select: none;
      }

      .logo-container a {
        -webkit-user-drag: none;
      }

      /*
       * ==================================================
       * RXN iMEDIA REPOSITORY SVG
       * ==================================================
       *
       * Approximately 25% smaller than the original
       * 450px version.
       */
      #logo {
        display: inline-block;

        width: 338px;
        height: auto;

        margin-left: -5px;

        user-select: none;
        -webkit-user-select: none;
        -webkit-user-drag: none;
      }

      /*
       * ==================================================
       * NORMAL TEXT LOGO FALLBACK
       * ==================================================
       */
      #logo-text {
        display: none;
      }

      /*
       * ==================================================
       * ULTRA-SMALL TEXT LOGO
       * ==================================================
       *
       * Used only below 124px.
       */
      #ultra-logo {
        display: none;
      }

      /*
       * ==================================================
       * 481px - 772px
       * ==================================================
       *
       * Full SVG logo.
       * Error text shifted 30px right.
       * Robot moves below the content.
       */
      @media screen and (min-width: 481px) and (max-width: 772px) {
        body {
          background: none;

          margin-top: 0;
          max-width: none;

          padding: 20px;
        }

        #logo {
          width: min(338px, 100%);
          height: auto;

          margin-left: -5px;
        }

        p {
          margin: -10px 0 20px 30px;
        }

        body::after {
          content: "";

          display: block;

          width: 100%;
          height: 238px;

          margin-top: 10px;

          background:
            url("https://www.google.com/images/errors/robot.png")
            center top
            no-repeat;

          background-size: contain;
        }
      }

      /*
       * ==================================================
       * 251px - 480px
       * ==================================================
       *
       * Center the SVG, error text and robot.
       */
      @media screen and (min-width: 251px) and (max-width: 480px) {
        html,
        code {
          font-size: 14px;
          line-height: 21px;
        }

        body {
          background: none;

          margin-top: 0;
          max-width: none;

          padding: 15px;

          text-align: center;
        }

        .logo-container {
          text-align: center;
        }

        #logo {
          display: inline-block;

          width: min(338px, 100%);
          height: auto;

          margin-left: 0;
        }

        p {
          margin: -10px 0 20px 0;

          overflow: visible;

          text-align: center;
        }

        body::after {
          content: "";

          display: block;

          width: 100%;
          height: 200px;

          margin-top: 10px;

          background:
            url("https://www.google.com/images/errors/robot.png")
            center top
            no-repeat;

          background-size: contain;
        }
      }

      /*
       * ==================================================
       * 180px - 250px
       * ==================================================
       *
       * Text-based RXN logo.
       *
       * Keep:
       * - RXN Research&Dev
       * - iMedia Repository
       * - 404
       * - robot
       */
      @media screen and (min-width: 180px) and (max-width: 250px) {
        html,
        code {
          font-size: 14px;
          line-height: 21px;
        }

        body {
          background: none;

          margin-top: 0;
          max-width: none;

          padding: 15px;

          text-align: center;
        }

        #logo {
          display: none;
        }

        #logo-text {
          display: inline-block;

          margin-left: 0;
          margin-bottom: 8px;

          font-family: Arial, sans-serif;

          text-align: center;
          text-decoration: none;
        }

        #logo-text .brand {
          display: block;

          font-size: 13px;
          line-height: 16px;

          font-weight: 400;

          color: #222;
        }

        #logo-text .repository {
          display: block;

          font-size: 21px;
          line-height: 24px;

          font-weight: 700;

          color: #4285f4;
        }

        p {
          margin: 11px 0 22px 0;

          overflow: visible;

          text-align: center;
        }

        body::after {
          content: "";

          display: block;

          width: 100%;
          height: 180px;

          margin-top: 10px;

          background:
            url("https://www.google.com/images/errors/robot.png")
            center top
            no-repeat;

          background-size: contain;
        }
      }

      /*
       * ==================================================
       * 124px - 179px
       * ==================================================
       *
       * Compact text-based layout:
       *
       * RXN Research&Dev
       * iMedia Repository
       *
       * 404. That's an error.
       * robot
       *
       * iMedia Repository is intentionally NOT bold
       * at this size.
       */
      @media screen and (min-width: 124px) and (max-width: 179px) {
        html,
        code {
          font-size: 13px;
          line-height: 18px;
        }

        html {
          padding: 8px;
        }

        body {
          background: none;

          margin-top: 0;
          max-width: none;
          min-height: 0;

          padding: 8px;

          text-align: center;
        }

        #logo {
          display: none;
        }

        #logo-text {
          display: inline-block;

          margin: 0 0 8px 0;

          font-family: Arial, sans-serif;

          text-align: center;
          text-decoration: none;
        }

        #logo-text .brand {
          display: block;

          font-size: 13px;
          line-height: 16px;

          font-weight: 400;

          color: #222;
        }

        #logo-text .repository {
          display: block;

          font-size: 13px;
          line-height: 16px;

          font-weight: 400;

          color: #4285f4;
        }

        p {
          margin: 8px 0;

          overflow: visible;

          text-align: center;
        }

        /*
         * Hide the full explanation.
         */
        p + p {
          display: none;
        }

        /*
         * Keep the robot underneath.
         */
        body::after {
          content: "";

          display: block;

          width: 100%;
          height: 150px;

          margin-top: 8px;

          background:
            url("https://www.google.com/images/errors/robot.png")
            center top
            no-repeat;

          background-size: contain;
        }
      }

      /*
       * ==================================================
       * UNDER 124px
       * ==================================================
       *
       * Absolute minimum mode:
       *
       * RXN R&D
       * iMR
       *
       * 404.
       * That's an error.
       *
       * No SVG.
       * No robot.
       * No explanation.
       */
      @media screen and (max-width: 123px) {
        html,
        code {
          font-size: 12px;
          line-height: 16px;
        }

        html {
          padding: 4px;
        }

        body {
          background: none;

          margin: 0;
          max-width: none;
          min-height: 0;

          padding: 4px;

          text-align: center;
        }

        /*
         * Hide all normal branding.
         */
        #logo {
          display: none;
        }

        #logo-text {
          display: none;
        }

        /*
         * Show the dedicated ultra-compact label.
         */
        #ultra-logo {
          display: inline-block;

          margin: 0 0 6px 0;

          font-family: Arial, sans-serif;

          font-size: 12px;
          line-height: 14px;
          font-weight: 700;

          color: #222;

          text-align: center;
          text-decoration: none;
          white-space: nowrap;
        }

        #ultra-logo span {
          color: #4285f4;
        }

        /*
         * Only keep the 404 line.
         */
        p {
          margin: 6px 0;

          overflow: visible;

          text-align: center;
        }

        /*
         * Hide the full explanation.
         */
        p + p {
          display: none;
        }

        /*
         * No images at this size.
         */
        body::after {
          display: none;
        }
      }
    </style>
  </head>

  <body>

    <!--
      RXN iMedia Repository branding.

      >250px:
        Full SVG

      180px-250px:
        Text-based RXN + iMedia Repository

      124px-179px:
        RXN Research&Dev + iMedia Repository + robot

      <124px:
        RXN R&D / iMR + 404 only
    -->
    <div class="logo-container">

      <a
        href="https://github.com/HadesXR-Git/RXNiMediaRepo"
        title="Visit the GitHub Repository"
        draggable="false"
      >
        <!-- Full SVG logo -->
        <img
          id="logo"
          src="https://raw.githubusercontent.com/HadesXR-Git/RXNiMediaRepo/main/iMedRepo.svg"
          alt="RXN iMedia Repository"
          draggable="false"
        >

        <!-- Normal text fallback -->
        <span id="logo-text">
          <span class="brand"><b>RXN</b> Research&amp;Dev</span>
          <span class="repository">iMedia Repository</span>
        </span>

        <!-- Ultra-small text fallback -->
        <span id="ultra-logo">
          RXN R&amp;D <br>
          <span>iMR</span>
        </span>
      </a>

    </div>

    <!--
      404 message
    -->
    <p>
      <b>404.</b> <br>
      <ins>That’s an error.</ins>
    </p>

    <!--
      Full explanation.
      Hidden below 180px.
    -->
    <p>
      The requested page
      <code>iMedia Repository</code>
      is still under construction.
      <ins>That’s all we know.</ins>
    </p>

  </body>
</html>

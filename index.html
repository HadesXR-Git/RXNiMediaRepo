<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Error 404 (Not Found)!!! - Under Construction</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    code {
      font: 15px/22px Arial, sans-serif;
    }

    html {
      background: #fff;
      color: #222;
    }

    body {
      margin: 7% auto 0;
      max-width: 720px;
      min-height: 300px;
      padding: 30px 0 15px;
      position: relative;
    }
	  
    #logo {
      display: block;
      width: 450px;
      height: auto;
      margin-left: -5px;

      /*
       * Slightly "broken" positioning is intentional.
       * Remove these two lines if you want a perfectly
       * centered/normal-looking logo.
       */
      transform: translate(-8px, 0);
    }

    .error {
      margin-top: 10px;
      margin-left: 0;
    }

    p {
      margin: 11px 0 22px;
      overflow: hidden;
    }

    b {
      font-weight: 700;
    }

    ins {
      color: #777;
      text-decoration: none;
    }

    code {
      color: #222;
    }

    /*
     * Desktop layout
     */
    @media screen and (min-width: 773px) {
      body {
        padding-right: 0;
      }

      #logo {
        /*
         * This pushes the artwork slightly out of alignment,
         * giving the 404 page its "something went wrong" feel.
         */
        transform: translate(-12px, -3px);
      }

      .error {
        margin-top: 8px;
      }
    }

    /*
     * Tablet / mobile
     */
    @media screen and (max-width: 772px) {
      body {
        margin: 0 auto;
        max-width: 100%;
        min-height: 0;
        padding: 20px;
      }

      #logo {
        width: min(450px, 100%);
        height: auto;
        margin-left: 0;

        /*
         * Remove the desktop displacement on small screens.
         */
        transform: none;
      }

      .error {
        margin-top: 15px;
      }
    }

    /*
     * Very small screens
     */
    @media screen and (max-width: 480px) {
      body {
        padding: 15px;
      }

      #logo {
        width: 100%;
      }

      html,
      code {
        font-size: 14px;
        line-height: 21px;
      }

      p {
        margin-bottom: 18px;
      }
    }
  </style>
</head>

<body>

  <!--
    RXN iMedia Repository logo/artwork.

    If the SVG is hosted in the same folder as this HTML,
    use:

      src="./iMedRepo.svg"

    If you are hosting it on GitHub, use the raw URL below.
  -->
  <img
    id="logo"
    src="https://raw.githubusercontent.com/HadesXR-Git/RXNiMediaRepo/main/iMedRepo.svg"
    alt="RXN iMedia Repository"
  >

  <div class="error">

    <p>
      <b>404.</b>
      <ins>That’s an error.</ins>
    </p>

    <p>
      The requested page
      <code>iMedia Repository</code>
      is still on construction.
      <ins>That’s all we know.</ins>
    </p>

  </div>

</body>
</html>
```

```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Error 404 (Not Found)!!! - Under Construction</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    code {
      font: 15px/22px Arial, sans-serif;
    }

    html {
      background: #fff;
      color: #222;
    }

    body {
      margin: 7% auto 0;
      max-width: 720px;
      min-height: 300px;
      padding: 30px 0 15px;
      position: relative;

      /*
       * Google's original 404 robot.
       * This is separate from iMedRepo.svg.
       */
      background:
        url("https://www.google.com/images/errors/robot.png")
        right 5px top
        no-repeat;
    }

    /*
     * RXN iMedia Repository artwork.
     *
     * The SVG contains the RXN Research&Dev /
     * iMedia Repository branding.
     *
     * The robot above is a separate image.
     */
    #logo {
      display: block;

      /*
       * Keep the SVG at its intended width.
       */
      width: 450px;
      height: auto;

      margin-left: -5px;

      /*
       * Slight 404 displacement.
       * This is intentional.
       */
      transform: translate(-8px, 0);
    }

    .error {
      margin-top: 10px;
    }

    p {
      margin: 11px 0 22px;
      overflow: hidden;
    }

    b {
      font-weight: 700;
    }

    ins {
      color: #777;
      text-decoration: none;
    }

    code {
      color: #222;
    }

    /*
     * Desktop
     */
    @media screen and (min-width: 773px) {

      body {
        /*
         * Leave room for Google's robot.
         */
        padding-right: 205px;
      }

      #logo {
        /*
         * Let the artwork slightly escape its
         * normal alignment on the 404 page.
         */
        transform: translate(-12px, -3px);
      }
    }

    /*
     * Tablet / mobile
     */
    @media screen and (max-width: 772px) {

      body {
        margin: 0 auto;
        max-width: 100%;
        min-height: 0;
        padding: 20px;

        /*
         * Hide the large desktop robot on small screens,
         * just like Google's original responsive behavior.
         */
        background: none;
      }

      #logo {
        width: min(450px, 100%);
        height: auto;
        margin-left: 0;
        transform: none;
      }

      .error {
        margin-top: 15px;
      }
    }

    /*
     * Very small screens
     */
    @media screen and (max-width: 480px) {

      body {
        padding: 15px;
      }

      #logo {
        width: 100%;
      }

      html,
      code {
        font-size: 14px;
        line-height: 21px;
      }

      p {
        margin-bottom: 18px;
      }
    }
  </style>
</head>

<body>

  <!--
    RXN iMedia Repository artwork.
  -->
  <img
    id="logo"
    src="https://raw.githubusercontent.com/HadesXR-Git/RXNiMediaRepo/main/iMedRepo.svg"
    alt="RXN iMedia Repository"
  >

  <div class="error">

    <p>
      <b>404.</b>
      <ins>That’s an error.</ins>
    </p>

    <p>
      The requested page
      <code>iMedia Repository</code>
      is still on construction.
      <ins>That’s all we know.</ins>
    </p>

  </div>

</body>
</html>
```
